<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 1340" role="img" aria-labelledby="title desc">
<title id="title">From idea to verified detection</title><desc id="desc">Seeder turns pentest runs, CVE advisories, threat intel, coverage gaps, incident retros and manual ideas into candidate detections. Tuner, Herald, Warden and Porter prepare each rule. Human approval precedes shipping, and maintainer review precedes production. Sentry verifies deployed rules. Mechanism failures and recalls return to Tuner; overlaps pause for a human.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#18222e"/><stop offset="1" stop-color="#10161e"/></linearGradient>
  <linearGradient id="card" x2="1" y2="1"><stop stop-color="#202c39"/><stop offset="1" stop-color="#19232f"/></linearGradient>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 8 5 1 9" fill="none" stroke="#7ee787" stroke-width="1.6"/></marker>
  <marker id="return" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 8 5 1 9" fill="none" stroke="#90bcfa" stroke-width="1.6"/></marker>
</defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#e5edf5}.mono{font-family:'SF Mono',Menlo,Consolas,monospace;letter-spacing:1px}</style>
<rect width="840" height="1340" rx="22" fill="url(#bg)"/>

<text x="40" y="44" font-size="14" style="fill:#7ee787" class="mono">01 / DETECTION LIFECYCLE</text>
<text x="40" y="86" font-size="32" font-weight="600">From idea to verified detection</text>
<text x="40" y="117" font-size="18" style="fill:#a2afbf">Every promotion carries evidence. Every failure has a return path.</text>
<rect x="96" y="150" width="704" height="760" rx="18" fill="#131c26" stroke="#344251"/>
<text x="118" y="180" font-size="13" style="fill:#7ee787" class="mono">FACTORY</text>
<text x="500" y="180" font-size="15" style="fill:#a2afbf">No production repository credential</text>
<rect x="123" y="212" width="100" height="34" rx="17" fill="url(#card)" stroke="#47765b"/>
<text x="173" y="234" font-size="11.5" text-anchor="middle" style="fill:#c5d1dd">Manual ideas</text>
<path d="M173 250 V286" fill="none" stroke="#7ee787" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="236" y="212" width="100" height="34" rx="17" fill="url(#card)" stroke="#47765b"/>
<text x="286" y="234" font-size="11.5" text-anchor="middle" style="fill:#c5d1dd">Pentest runs</text>
<path d="M286 250 V286" fill="none" stroke="#7ee787" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="349" y="212" width="100" height="34" rx="17" fill="url(#card)" stroke="#47765b"/>
<text x="399" y="234" font-size="11.5" text-anchor="middle" style="fill:#c5d1dd">CVE advisories</text>
<path d="M399 250 V286" fill="none" stroke="#7ee787" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="462" y="212" width="100" height="34" rx="17" fill="url(#card)" stroke="#47765b"/>
<text x="512" y="234" font-size="11.5" text-anchor="middle" style="fill:#c5d1dd">Threat intel</text>
<path d="M512 250 V286" fill="none" stroke="#7ee787" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="575" y="212" width="100" height="34" rx="17" fill="url(#card)" stroke="#47765b"/>
<text x="625" y="234" font-size="11.5" text-anchor="middle" style="fill:#c5d1dd">Coverage gaps</text>
<path d="M625 250 V286" fill="none" stroke="#7ee787" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="688" y="212" width="100" height="34" rx="17" fill="url(#card)" stroke="#47765b"/>
<text x="738" y="234" font-size="11.5" text-anchor="middle" style="fill:#c5d1dd">Incident retros</text>
<path d="M738 250 V286" fill="none" stroke="#7ee787" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="118" y="290" width="660" height="80" rx="14" fill="url(#card)" stroke="#344251"/>
<text x="136" y="319" font-size="14" style="fill:#7ee787" class="mono">000</text>
<text x="188" y="321" font-size="25" font-weight="600">Seeder</text>
<text x="136" y="352" font-size="16" style="fill:#a2afbf">Each signal becomes a one-line idea: titled, deduped, ranked, queued</text>
<text x="760" y="320" font-size="13" text-anchor="end" style="fill:#7ee787" class="mono">IDEA INTAKE</text>
<path d="M294 374 V402" fill="none" stroke="#7ee787" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="310" y="394" font-size="13" style="fill:#7ee787" class="mono">proposed</text>
<g transform="translate(0,150)">
<rect x="118" y="256" width="354" height="87" rx="14" fill="url(#card)" stroke="#344251"/>
<text x="136" y="285" font-size="14" style="fill:#7ee787" class="mono">001</text>
<text x="188" y="287" font-size="25" font-weight="600">Tuner</text>
<text x="136" y="318" font-size="16" style="fill:#a2afbf">Draft + backtest on real telemetry</text>
<text x="500" y="286" font-size="13" style="fill:#7ee787" class="mono">VOLUME GATE</text>
<text x="500" y="315" font-size="17" style="fill:#a2afbf">Within the alert budget</text>
<path d="M294 343 V372" fill="none" stroke="#7ee787" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="310" y="364" font-size="13" style="fill:#7ee787" class="mono">ready_for_review</text>
<rect x="118" y="376" width="354" height="87" rx="14" fill="url(#card)" stroke="#344251"/>
<text x="136" y="405" font-size="14" style="fill:#7ee787" class="mono">002</text>
<text x="188" y="407" font-size="25" font-weight="600">Herald</text>
<text x="136" y="438" font-size="16" style="fill:#a2afbf">Review by a different model family</text>
<text x="500" y="406" font-size="13" style="fill:#7ee787" class="mono">ADVERSARIAL REVIEW</text>
<text x="500" y="435" font-size="17" style="fill:#a2afbf">Intent questions → human</text>
<path d="M294 463 V492" fill="none" stroke="#7ee787" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="310" y="484" font-size="13" style="fill:#7ee787" class="mono">reviewed</text>
<rect x="118" y="496" width="354" height="87" rx="14" fill="url(#card)" stroke="#344251"/>
<text x="136" y="525" font-size="14" style="fill:#7ee787" class="mono">003</text>
<text x="188" y="527" font-size="25" font-weight="600">Warden</text>
<text x="136" y="558" font-size="16" style="fill:#a2afbf">Compare with the deployed-rule index</text>
<text x="500" y="526" font-size="13" style="fill:#7ee787" class="mono">DUPLICATE GATE</text>
<text x="500" y="555" font-size="17" style="fill:#a2afbf">Overlap → pause for a human</text>
<path d="M294 583 V612" fill="none" stroke="#7ee787" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="310" y="604" font-size="13" style="fill:#7ee787" class="mono">passed</text>
<rect x="118" y="616" width="354" height="87" rx="14" fill="url(#card)" stroke="#344251"/>
<text x="136" y="645" font-size="14" style="fill:#7ee787" class="mono">004</text>
<text x="188" y="647" font-size="25" font-weight="600">Porter</text>
<text x="136" y="678" font-size="16" style="fill:#a2afbf">Deposit the approved rule in the outbox</text>
<text x="500" y="646" font-size="13" style="fill:#edc777" class="mono">HUMAN GATE 1</text>
<text x="500" y="675" font-size="17" style="fill:#edc777">Approve before shipping</text>
<path d="M294 703 V732" fill="none" stroke="#7ee787" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="310" y="724" font-size="13" style="fill:#7ee787" class="mono">shipped</text>
<path d="M118 419 H72 V300 H115" fill="none" stroke="#90bcfa" stroke-width="2" stroke-linejoin="round" stroke-dasharray="5 7" marker-end="url(#return)"/>
<text x="500" y="450" font-size="16" style="fill:#90bcfa">Broken mechanism → Tuner</text>
<rect x="118" y="783" width="660" height="68" rx="14" fill="#29271f" stroke="#74633e"/>
<text x="138" y="809" font-size="13" style="fill:#edc777" class="mono">HUMAN GATE 2</text>
<text x="138" y="835" font-size="17">Pull agent opens a merge request; maintainer reviews + merges.</text>
<path d="M294 736 V780" fill="none" stroke="#7ee787" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M294 851 V883" fill="none" stroke="#7ee787" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="118" y="887" width="354" height="72" rx="14" fill="#182e29" stroke="#47765b"/>
<text x="138" y="917" font-size="25" font-weight="600">Production</text>
<text x="138" y="942" font-size="15" style="fill:#a2afbf">Rule deployed through the protected branch</text>
<text x="500" y="920" font-size="13" style="fill:#7ee787" class="mono">LIVE</text>
<text x="500" y="946" font-size="16" style="fill:#a2afbf">Independent deployment boundary</text>
<path d="M294 959 V990" fill="none" stroke="#7ee787" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="118" y="994" width="354" height="87" rx="14" fill="url(#card)" stroke="#344251"/>
<text x="136" y="1023" font-size="14" style="fill:#7ee787" class="mono">005</text>
<text x="188" y="1025" font-size="25" font-weight="600">Sentry</text>
<text x="136" y="1056" font-size="16" style="fill:#a2afbf">Daily liveness checks + mutation replay</text>
<text x="500" y="1024" font-size="13" style="fill:#7ee787" class="mono">CONTINUOUS VERIFICATION</text>
<text x="500" y="1053" font-size="17" style="fill:#a2afbf">Prove the deployed rule still fires</text>
<path d="M118 1038 H48 V300 H115" fill="none" stroke="#90bcfa" stroke-width="2" stroke-linejoin="round" stroke-dasharray="5 7" marker-end="url(#return)"/>
<path d="M118 817 H48" fill="none" stroke="#90bcfa" stroke-width="2" stroke-linejoin="round" stroke-dasharray="5 7"/>
<path d="M40 1130 H72" fill="none" stroke="#90bcfa" stroke-width="2" stroke-linejoin="round" stroke-dasharray="5 7"/>
<text x="86" y="1136" font-size="16" style="fill:#90bcfa">RECALL / Failed verification or reviewer rejection returns to Tuner.</text>
<text x="86" y="1161" font-size="16" style="fill:#a2afbf">Evidence becomes the next work order; the rule traverses the line again.</text>
</g>
</svg>
