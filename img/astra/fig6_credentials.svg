<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 1080" role="img" aria-labelledby="title desc">
<title id="title">Separate credentials. Explicit human control.</title><desc id="desc">Four separate access boundaries: factory, outbox, pull agent and production repository. Factory can write only to the outbox. The pull agent holds outbox read access and the repository credential but cannot merge. Two human gates control shipping and merging.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#18222e"/><stop offset="1" stop-color="#10161e"/></linearGradient>
  <linearGradient id="card" x2="1" y2="1"><stop stop-color="#202c39"/><stop offset="1" stop-color="#19232f"/></linearGradient>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 8 5 1 9" fill="none" stroke="#7ee787" stroke-width="1.6"/></marker>
  <marker id="return" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 8 5 1 9" fill="none" stroke="#90bcfa" stroke-width="1.6"/></marker>
</defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#e5edf5}.mono{font-family:'SF Mono',Menlo,Consolas,monospace;letter-spacing:1px}</style>
<rect width="840" height="1080" rx="22" fill="url(#bg)"/>

<text x="40" y="44" font-size="14" style="fill:#7ee787" class="mono">02 / CREDENTIAL BOUNDARIES</text>
<text x="40" y="86" font-size="32" font-weight="600">Separate credentials. Human control.</text>
<text x="40" y="117" font-size="18" style="fill:#a2afbf">Four access boundaries. No principal can author and land a rule alone.</text>
<rect x="76" y="156" width="724" height="148" rx="14" fill="url(#card)" stroke="#344251"/>
<rect x="76" y="176" width="3" height="108" rx="1.5" fill="#edc777"/>
<text x="98" y="190" font-size="15" style="fill:#edc777" class="mono">01</text>
<text x="144" y="192" font-size="26" font-weight="600">Factory</text>
<text x="98" y="224" font-size="18" style="fill:#a2afbf">Porter writes the approved rule</text>
<text x="490" y="189" font-size="13" style="fill:#edc777" class="mono">HUMAN GATE 1</text>
<text x="490" y="221" font-size="16">Pre-ship approval</text>
<path d="M98 247 H778" fill="none" stroke="#344251" stroke-width="2" stroke-linejoin="round"/>
<text x="98" y="279" font-size="16" style="fill:#a2afbf">No production repository credential</text>
<rect x="76" y="370" width="724" height="148" rx="14" fill="url(#card)" stroke="#344251"/>
<rect x="76" y="390" width="3" height="108" rx="1.5" fill="#7ee787"/>
<text x="98" y="404" font-size="15" style="fill:#7ee787" class="mono">02</text>
<text x="144" y="406" font-size="26" font-weight="600">Outbox</text>
<text x="98" y="438" font-size="18" style="fill:#a2afbf">An isolated handoff for rule artifacts</text>
<text x="490" y="403" font-size="13" style="fill:#7ee787" class="mono">SCOPED STORAGE</text>
<text x="490" y="435" font-size="16">Rule files + status</text>
<path d="M98 461 H778" fill="none" stroke="#344251" stroke-width="2" stroke-linejoin="round"/>
<text x="98" y="493" font-size="16" style="fill:#a2afbf">This boundary contains only the outbox</text>
<rect x="76" y="584" width="724" height="148" rx="14" fill="url(#card)" stroke="#344251"/>
<rect x="76" y="604" width="3" height="108" rx="1.5" fill="#90bcfa"/>
<text x="98" y="618" font-size="15" style="fill:#90bcfa" class="mono">03</text>
<text x="144" y="620" font-size="26" font-weight="600">Pull agent</text>
<text x="98" y="652" font-size="18" style="fill:#a2afbf">Operated by a separate team</text>
<text x="490" y="617" font-size="13" style="fill:#90bcfa" class="mono">TWO CREDENTIALS</text>
<text x="490" y="649" font-size="16">Outbox read + repository access</text>
<path d="M98 675 H778" fill="none" stroke="#344251" stroke-width="2" stroke-linejoin="round"/>
<text x="98" y="707" font-size="16" style="fill:#a2afbf">Can create a branch and merge request; cannot merge</text>
<rect x="76" y="798" width="724" height="148" rx="14" fill="url(#card)" stroke="#344251"/>
<rect x="76" y="818" width="3" height="108" rx="1.5" fill="#edc777"/>
<text x="98" y="832" font-size="15" style="fill:#edc777" class="mono">04</text>
<text x="144" y="834" font-size="26" font-weight="600">Production repository</text>
<text x="98" y="866" font-size="18" style="fill:#a2afbf">Protected branch</text>
<text x="490" y="831" font-size="13" style="fill:#edc777" class="mono">HUMAN GATE 2</text>
<text x="490" y="863" font-size="16">Maintainer review + merge</text>
<path d="M98 889 H778" fill="none" stroke="#344251" stroke-width="2" stroke-linejoin="round"/>
<text x="98" y="921" font-size="16" style="fill:#a2afbf">Branch protection enforces the final approval</text>
<path d="M160 304 V366" fill="none" stroke="#7ee787" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="190" y="330" font-size="13" style="fill:#7ee787" class="mono">WRITE → OUTBOX ONLY</text>
<text x="190" y="353" font-size="16" style="fill:#a2afbf">Factory credential is scoped to this handoff.</text>
<path d="M160 518 V580" fill="none" stroke="#7ee787" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="190" y="544" font-size="13" style="fill:#7ee787" class="mono">READ → OUTBOX ONLY</text>
<text x="190" y="567" font-size="16" style="fill:#a2afbf">Pull agent retrieves artifacts with a read-only key.</text>
<path d="M160 732 V794" fill="none" stroke="#7ee787" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="190" y="758" font-size="13" style="fill:#7ee787" class="mono">CREATE BRANCH + MERGE REQUEST</text>
<text x="190" y="781" font-size="16" style="fill:#a2afbf">Repository credential stays with the pull agent.</text>
<path d="M76 873 H42 V230 H73" fill="none" stroke="#90bcfa" stroke-width="2" stroke-linejoin="round" stroke-dasharray="5 7" marker-end="url(#return)"/>
<text x="76" y="1000" font-size="13" style="fill:#90bcfa" class="mono">REJECTION RETURNS THE RULE TO THE FACTORY</text>
<text x="76" y="1028" font-size="17" style="fill:#a2afbf">Recall the outbox row, reset its stage, and attach reviewer feedback.</text>
<text x="76" y="1053" font-size="17" style="fill:#a2afbf">The repaired rule updates the same merge request.</text>
</svg>
